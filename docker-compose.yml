version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: dtg_ticket_db
      POSTGRES_USER: dtg_user
      POSTGRES_PASSWORD: dtg_password_22172
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    image: thetmyatnoethwin/dtg_fieldlink-backend:latest
    platform: linux/amd64
    container_name: backend
    ports:
      - "3000:3000"
    env_file:
      - backend/.env
    depends_on:
      - postgres
    restart: always

  web:
    build: ./web-admin
    container_name: web
    ports:
      - "3001:3000"
    volumes:
      - ./web-admin/.env:/app/.env
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
